# Builds the app and publishes dist/ to GitLab Pages on every push to master.
# The base path is derived from the Pages URL, so it works both with the
# project path (https://<user>.gitlab.io/darkovnik/) and with a unique domain.
image: node:22

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm test
    - export BASE_PATH="$(node -e 'console.log(new URL(process.env.CI_PAGES_URL || "https://example.test/darkovnik/").pathname.replace(/\/?$/, "/"))')"
    - echo "Pages base path $BASE_PATH"
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
